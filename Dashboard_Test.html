<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLI · Manager Dashboard</title>
  <!-- Font Awesome & jsPDF -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: #f4f7fc; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
    .app { max-width: 1400px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 40px -12px rgba(0,20,30,0.25); padding: 28px 30px 40px; }
    h1 { font-weight: 500; font-size: 1.9rem; color: #0b2b3d; display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #e7edf4; padding-bottom: 18px; margin-bottom: 28px; }
    h1 i { color: #2a6f8f; }
    .refresh-btn { background: #e8f0f8; border: none; padding: 6px 18px; border-radius: 30px; cursor: pointer; font-size: 0.85rem; color: #1d4b64; margin-left: auto; transition: 0.2s; }
    .refresh-btn:hover { background: #d0e2f0; }
    .loading { text-align: center; padding: 30px; color: #2a6f8f; }
    .manager-grid { display: flex; flex-wrap: wrap; gap: 14px 18px; margin-bottom: 30px; background: #f0f5fa; padding: 18px 22px; border-radius: 60px; }
    .manager-btn { background: white; border: none; padding: 10px 28px; border-radius: 40px; font-weight: 500; color: #1d3b4f; box-shadow: 0 2px 6px rgba(0,0,0,0.02); transition: all 0.2s; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
    .manager-btn i { color: #3d7b9b; }
    .manager-btn:hover { background: #e3edf5; border-color: #b3cfdf; transform: translateY(-2px); }
    .manager-btn.active { background: #1d4b64; color: white; border-color: #1d4b64; box-shadow: 0 8px 14px rgba(26,80,110,0.25); }
    .manager-btn.active i { color: white; }
    .panel { display: flex; flex-direction: row; flex-wrap: wrap; gap: 28px; margin-top: 8px; }
    .employee-list { flex: 1 1 260px; background: #f8fafd; border-radius: 24px; padding: 18px 0 18px 18px; max-height: 600px; overflow-y: auto; border: 1px solid #e2ecf3; }
    .employee-list h3 { font-weight: 500; color: #1d3b4f; padding-bottom: 12px; border-bottom: 1px solid #d5e2ec; margin-right: 18px; display: flex; align-items: center; gap: 8px; }
    .employee-list h3 i { color: #2f789b; }
    .employee-item { display: block; width: calc(100% - 18px); text-align: left; background: transparent; border: none; padding: 12px 16px; margin: 4px 0; border-radius: 40px 0 0 40px; font-weight: 500; color: #1c3a4b; transition: 0.15s; cursor: pointer; border-left: 3px solid transparent; }
    .employee-item i { margin-right: 12px; color: #487a98; width: 18px; }
    .employee-item:hover { background: #e3eef7; border-left-color: #5492b3; }
    .employee-item.active { background: #d2e6f2; border-left-color: #1d6d94; font-weight: 600; color: #0c3143; }
    .report-container { flex: 3 1 720px; background: white; border-radius: 28px; padding: 18px 22px 28px; border: 1px solid #dfecf3; box-shadow: 0 6px 14px rgba(0,20,30,0.04); }
    .report-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 18px; border-bottom: 1px dashed #cbdae6; padding-bottom: 14px; }
    .report-header h2 { font-weight: 500; color: #003153; font-size: 1.6rem; }
    .report-header h2 small { font-weight: 400; font-size: 1rem; color: #4d6f86; margin-left: 12px; }
    .action-buttons { display: flex; gap: 12px; }
    .action-btn { background: #f0f6fc; border: none; padding: 8px 18px; border-radius: 40px; font-weight: 500; color: #1d4b64; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
    .action-btn:hover { background: #dce8f2; border-color: #b8cfdf; }
    .action-btn.print-btn { background: #1d4b64; color: white; }
    .action-btn.print-btn:hover { background: #0f364b; }
    .action-btn.pdf-btn { background: #c0392b; color: white; }
    .action-btn.pdf-btn:hover { background: #922b21; }
    .template-report { font-size: 0.95rem; line-height: 1.6; color: #1e2f3d; }
    .template-report .title-cli { font-weight: 600; font-size: 1.3rem; letter-spacing: 0.5px; color: #003153; border-bottom: 2px solid #b0ccdd; padding-bottom: 8px; margin-bottom: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; }
    .template-report table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.9rem; }
    .template-report td, .template-report th { border: 1px solid #cbdae6; padding: 6px 10px; text-align: center; }
    .template-report th { background: #eef4fa; font-weight: 600; color: #15485f; }
    .template-report .section-title { font-weight: 600; color: #15485f; margin: 18px 0 6px; border-left: 5px solid #4582a3; padding-left: 14px; }
    .template-report .note { font-size: 0.85rem; color: #4d6f86; margin: 4px 0 8px; }
    .ppt-block { background: #f0f6fc; border-radius: 20px; padding: 14px 18px; margin-top: 16px; }
    .badge { background: #dcebf5; padding: 2px 12px; border-radius: 30px; font-size: 0.8rem; color: #003153; }
    .empty-state { text-align: center; color: #5d7e94; padding: 40px 10px; }
    .footer-note { margin-top: 22px; font-size: 0.8rem; color: #4d6f86; border-top: 1px solid #dde9f2; padding-top: 16px; text-align: right; }
    #passwordOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #passwordBox { background: white; padding: 40px 50px; border-radius: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
    #passwordBox h2 { color: #003153; margin-bottom: 20px; }
    #passwordBox input { width: 100%; padding: 12px 16px; border: 2px solid #d5e2ec; border-radius: 40px; font-size: 1rem; margin-bottom: 16px; outline: none; }
    #passwordBox input:focus { border-color: #2a6f8f; }
    #passwordBox button { background: #1d4b64; color: white; border: none; padding: 12px 30px; border-radius: 40px; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    #passwordBox button:hover { background: #0f364b; }
    #passwordError { color: #c0392b; font-size: 0.9rem; margin-top: 10px; display: none; }
    @media print { body { background: white; padding: 0.2in; } .app { box-shadow: none; border: none; padding: 10px; } .manager-grid, .employee-list, .action-buttons, .no-print { display: none !important; } .report-container { border: none; box-shadow: none; padding: 0; } .report-header h2 { font-size: 1.8rem; } }
  </style>
</head>
<body>
<!-- Password Overlay -->
<div id="passwordOverlay">
  <div id="passwordBox">
    <h2><i class="fas fa-lock" style="color:#2a6f8f;"></i> Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Enter access code" autofocus>
    <button id="passwordSubmit">Unlock Dashboard</button>
    <div id="passwordError">Incorrect password. Try again.</div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <h1><i class="fas fa-chart-pie"></i> CLI · Manager Dashboard
    <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
  </h1>
  <div class="manager-grid" id="managerList"></div>
  <div class="panel">
    <div class="employee-list" id="employeeList">
      <h3><i class="fas fa-users"></i> Team members</h3>
      <div id="employeeItems"></div>
    </div>
    <div class="report-container" id="reportContainer">
      <div class="report-header">
        <h2 id="reportTitle">Individual report <small id="reportSub">select employee</small></h2>
        <div class="action-buttons no-print">
          <button class="action-btn pdf-btn" id="pdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
          <button class="action-btn print-btn" id="printBtn"><i class="fas fa-print"></i> Print</button>
        </div>
      </div>
      <div id="reportContent" class="template-report">
        <div class="empty-state"><i class="fas fa-user-circle" style="font-size:2.4rem; opacity:0.4; display:block; margin-bottom:12px;"></i> Select a manager, then an employee</div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ============================================================
    // PASSWORD
    // ============================================================
    const PASSWORD = '2026';

    // ============================================================
    // CONFIGURATION — USING PUBLISHED GOOGLE SHEET
    // ============================================================
    const CONFIG = {
      // Published Google Sheet URL (HTML format)
      PUBLISHED_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQbrLo-Nb6HhhC0kaqyBEr2r6SNa0l2jLfVIdfkX8wlQKCP-MUVJ1z5hN56h1ypXuZZwcy-jvLGWGOj/pubhtml',
      // Alternative: Use CSV export (more reliable for parsing)
      CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQbrLo-Nb6HhhC0kaqyBEr2r6SNa0l2jLfVIdfkX8wlQKCP-MUVJ1z5hN56h1ypXuZZwcy-jvLGWGOj/pub?output=csv',
      // Fallback: Use Apps Script (if needed)
      APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwugpfGcBYVvOGgf3Q83bIrZ6LzUNfykqK-c_28etL2gMArhYSoigJbXrfIZe_00uGo/exec'
    };

    // ============================================================
    // STATE
    // ============================================================
    let allEmployees = [];
    let currentManagerId = null;
    let currentEmployeeIndex = 0;
    let managers = [];

    // DOM refs
    const managerListEl = document.getElementById('managerList');
    const employeeItemsEl = document.getElementById('employeeItems');
    const reportContent = document.getElementById('reportContent');
    const reportTitle = document.getElementById('reportTitle');
    const reportSub = document.getElementById('reportSub');
    const refreshBtn = document.getElementById('refreshBtn');
    const appEl = document.getElementById('app');

    // ============================================================
    // PASSWORD HANDLING
    // ============================================================
    function handlePassword() {
      const input = document.getElementById('passwordInput');
      const error = document.getElementById('passwordError');
      const overlay = document.getElementById('passwordOverlay');
      if (input.value === PASSWORD) {
        overlay.style.display = 'none';
        appEl.style.display = 'block';
        init();
      } else {
        error.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }
    document.getElementById('passwordSubmit').addEventListener('click', handlePassword);
    document.getElementById('passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handlePassword();
    });

    // ============================================================
    // FETCH DATA FROM PUBLISHED GOOGLE SHEET (CSV Method)
    // ============================================================
    async function fetchDataFromSheets() {
      try {
        isLoading = true;
        showLoadingState('Fetching data from Google Sheets...');
        
        // Method 1: Try CSV export (most reliable for published sheets)
        let csvData = '';
        try {
          const response = await fetch(CONFIG.CSV_URL);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          csvData = await response.text();
        } catch (csvError) {
          console.warn('CSV fetch failed, trying Apps Script:', csvError);
          // Fallback to Apps Script
          const response = await fetch(CONFIG.APPS_SCRIPT_URL);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const jsonData = await response.json();
          processSheetData(jsonData);
          return;
        }
        
        // Parse CSV
        const rows = csvData.split('\n').filter(row => row.trim() !== '');
        if (rows.length < 2) throw new Error('CSV has no data rows');
        
        // Get headers (first row)
        const headers = rows[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        
        // Parse data rows
        const data = [];
        for (let i = 1; i < rows.length; i++) {
          const values = rows[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
          const row = {};
          headers.forEach((header, idx) => {
            row[header] = values[idx] || '';
          });
          data.push(row);
        }
        
        processSheetData(data);
        
      } catch (error) {
        console.error('Fetch error:', error);
        isLoading = false;
        showErrorState('Failed to load data from Google Sheets. Using sample data. Error: ' + error.message);
        loadSampleData();
        buildManagersFromData();
        renderAll();
      }
    }

    // ============================================================
    // PROCESS SHEET DATA
    // ============================================================
    function processSheetData(data) {
      // Map to employee objects
      allEmployees = data.map((row, idx) => {
        const get = (key) => {
          const keys = Object.keys(row);
          const exact = keys.find(k => k === key);
          if (exact) return row[exact];
          const lower = keys.find(k => k.toLowerCase() === key.toLowerCase());
          return lower ? row[lower] : '';
        };
        const toInt = (v) => parseInt(String(v).replace(/,/g, '')) || 0;
        const toStr = (v) => String(v || '').trim();

        return {
          sl: toInt(get('Sl. No')) || idx + 1,
          roll: toStr(get('Roll Number')),
          name: toStr(get('User full name')),
          section: toStr(get('Section')),
          email: toStr(get('student Email Address')),
          op: toInt(get('Op')), opGrd: toStr(get('Op Grd')),
          cst: toInt(get('Cst')), cstGrd: toStr(get('Cst Grd')),
          ext: toInt(get('Ext')), extGrd: toStr(get('Ext Grd')),
          agr: toInt(get('Agr')), agrGrd: toStr(get('Agr Grd')),
          stb: toInt(get('Stb')), stbGrd: toStr(get('Stb Grd')),
          aown: toInt(get('Aown')), aownGrd: toStr(get('Aown Grd')),
          cont: toInt(get('Cont')), contGrd: toStr(get('Cont Grd')),
          adpt: toInt(get('Adpt')), adptGrd: toStr(get('Adpt Grd')),
          post: toInt(get('Post')), postGrd: toStr(get('Post Grd')),
          empth: toInt(get('Empth')), empthGrd: toStr(get('Empth Grd')),
          conf: toInt(get('Conf')), confGrd: toStr(get('Conf Grd')),
          aother: toInt(get('Aother')), aotherGrd: toStr(get('Aother Grd')),
          eqTot: toInt(get('EqTot')), eqTotGrd: toStr(get('EqTot Grd')),
          se: toInt(get('SE')), seGrd: toStr(get('SEGR1')),
          loc: toInt(get('LOC')), locGrd: toStr(get('LOCGR1')),
          iia: toInt(get('II-A')), iiaGrd: toStr(get('II-A Grd')),
          iib: toInt(get('II-B')), iibGrd: toStr(get('II-B Grd')),
          im: toInt(get('IM')), imGrd: toStr(get('IM Grd')),
          is: toInt(get('IS')), isGrd: toStr(get('IS Grd')),
          ic: toInt(get('IC')), icGrd: toStr(get('IC Grd')),
          tflTot: toInt(get('TFL Tot')), tflGrd: toStr(get('TFL Grd')),
          crew: toInt(get('CRew')), crewGrd: toStr(get('Crew Grd')),
          mba: toInt(get('MBA')), mbaGrd: toStr(get('MBA Grd')),
          mbp: toInt(get('MBP')), mbpGrd: toStr(get('MBP Grd')),
          lf: toInt(get('LF')), lfGrd: toStr(get('LF Grd')),
          effect: toInt(get('Effect')), effectGrd: toStr(get('Effect Grd')),
          eefrt: toInt(get('EEfrt')), eefrtGrd: toStr(get('Eefrt Grd')),
          satis: toInt(get('Satis')), satisGrd: toStr(get('Satis Grd')),
          ei: toInt(get('EI')), eiGrd: toStr(get('EI Grd')),
          wi: toInt(get('WI')), wiGrd: toStr(get('WI Grd')),
          ec: toInt(get('EC')), ecGrd: toStr(get('EC Grd')),
          wc: toInt(get('WC')), wcGrd: toStr(get('WC Grd')),
          ea: toInt(get('EA')), eaGrd: toStr(get('EA Grd')),
          wa: toInt(get('WA')), waGrd: toStr(get('WA Grd')),
          incTot: toInt(get('Inc Tot')), incGrd: toStr(get('Inc Grd')),
          contTot: toInt(get('Cont Tot')), contGrd: toStr(get('Cont Grd')),
          affTot: toInt(get('Aff Tot')), affGrd: toStr(get('Aff Grd')),
          expTot: toInt(get('Exp Tot')), expGrd: toStr(get('Exp Grd')),
          wantTot: toInt(get('Want Tot')), wantGrd: toStr(get('Want Grd')),
          firoTot: toInt(get('FIRO Tot')), firoGrd: toStr(get('FIRO Grd')),
          nPowInc: toInt(get('nPow Inc')), nPowPct: toStr(get('nPow%')), nPowInterp: toStr(get('nPow Interp')),
          nAchInc: toInt(get('nAch Inc')), nAchPct: toStr(get('nAch%')), nAchInterp: toStr(get('nAch Interp')),
          nAffInc: toInt(get('nAff Inc')), nAffPct: toStr(get('nAff%')), nAffInterp: toStr(get('nAff Interp')),
          facultyName: toStr(get('Faculty Name')),
          facultyEmail: toStr(get('Faculty Email'))
        };
      });

      allEmployees = allEmployees.filter(emp => emp.name && emp.name !== '');
      
      buildManagersFromData();
      isLoading = false;
      console.log('Successfully loaded', allEmployees.length, 'employees');
      
      // Render everything
      renderAll();
    }

    // ============================================================
    // BUILD MANAGERS FROM DATA
    // ============================================================
    function buildManagersFromData() {
      const facultyMap = new Map();
      allEmployees.forEach(emp => {
        if (emp.facultyName) {
          const key = emp.facultyName.trim();
          if (!facultyMap.has(key)) {
            facultyMap.set(key, { name: key, email: emp.facultyEmail, sections: new Set() });
          }
          facultyMap.get(key).sections.add(emp.section);
        }
      });
      
      if (facultyMap.size === 0) {
        const sections = [...new Set(allEmployees.map(e => e.section))];
        sections.forEach(sec => {
          facultyMap.set(`Manager ${sec}`, { name: `Manager ${sec}`, email: '', sections: new Set([sec]) });
        });
      }
      
      managers = Array.from(facultyMap.entries()).map(([id, info]) => ({
        id: id.replace(/\s+/g, '_'),
        label: info.name,
        email: info.email,
        sections: Array.from(info.sections)
      }));
      managers.sort((a,b) => a.label.localeCompare(b.label));
      managers.unshift({ id: 'mgrAll', label: 'All (dev)', sections: ['A','D','E'] });
    }

    // SAMPLE DATA (FALLBACK)

        { sl:1, roll:'246213010', name:'Name1', section:'D', email:'n1@k.com', op:77, opGrd:'S', cst:82, cstGrd:'S', ext:60, extGrd:'R', agr:70, agrGrd:'S', stb:65, stbGrd:'R', aown:72, aownGrd:'S', cont:68, contGrd:'R', adpt:74, adptGrd:'S', post:66, postGrd:'R', empth:69, empthGrd:'S', conf:71, confGrd:'S', aother:63, aotherGrd:'R', eqTot:68, eqTotGrd:'S', se:75, seGrd:'S', loc:70, locGrd:'R', iia:22, iiaGrd:'S', iib:19, iibGrd:'R', im:17, imGrd:'S', is:24, isGrd:'S', ic:21, icGrd:'R', tflTot:103, tflGrd:'S', crew:12, crewGrd:'R', mba:9, mbaGrd:'R', mbp:8, mbpGrd:'R', lf:14, lfGrd:'S', effect:18, effectGrd:'S', eefrt:16, eefrtGrd:'R', satis:20, satisGrd:'S', ei:23, eiGrd:'S', wi:19, wiGrd:'R', ec:16, ecGrd:'S', wc:21, wcGrd:'R', ea:14, eaGrd:'S', wa:18, waGrd:'R', incTot:42, incGrd:'S', contTot:37, contGrd:'R', affTot:32, affGrd:'S', expTot:53, expGrd:'R', wantTot:58, wantGrd:'S', firoTot:111, firoGrd:'S', nPowInc:4, nPowPct:'36%', nPowInterp:'MOD', nAchInc:3, nAchPct:'27%', nAchInterp:'DOM', nAffInc:2, nAffPct:'18%', nAffInterp:'MIN', facultyName:'Dr. Smith', facultyEmail:'smith@k.com' },
        { sl:2, roll:'246213060', name:'Name2', section:'D', email:'n2@k.com', op:63, opGrd:'R', cst:56, cstGrd:'R', ext:53, extGrd:'R', agr:60, agrGrd:'R', stb:58, stbGrd:'R', aown:55, aownGrd:'R', cont:62, contGrd:'R', adpt:59, adptGrd:'R', post:57, postGrd:'R', empth:61, empthGrd:'R', conf:64, confGrd:'R', aother:52, aotherGrd:'R', eqTot:58, eqTotGrd:'R', se:60, seGrd:'R', loc:55, locGrd:'R', iia:18, iiaGrd:'R', iib:16, iibGrd:'R', im:14, imGrd:'R', is:19, isGrd:'R', ic:17, icGrd:'R', tflTot:84, tflGrd:'R', crew:10, crewGrd:'R', mba:7, mbaGrd:'R', mbp:6, mbpGrd:'R', lf:11, lfGrd:'R', effect:14, effectGrd:'R', eefrt:12, eefrtGrd:'R', satis:15, satisGrd:'R', ei:18, eiGrd:'R', wi:15, wiGrd:'R', ec:13, ecGrd:'R', wc:17, wcGrd:'R', ea:11, eaGrd:'R', wa:14, waGrd:'R', incTot:33, incGrd:'R', contTot:30, contGrd:'R', affTot:25, affGrd:'R', expTot:42, expGrd:'R', wantTot:46, wantGrd:'R', firoTot:88, firoGrd:'R', nPowInc:2, nPowPct:'18%', nPowInterp:'MIN', nAchInc:4, nAchPct:'36%', nAchInterp:'DOM', nAffInc:1, nAffPct:'9%', nAffInterp:'INS', facultyName:'Dr. Jones', facultyEmail:'jones@k.com' }
      ];
    }

    // ============================================================
    // UI HELPERS
    // ============================================================
    function showLoadingState(msg) {
      reportContent.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-spin" style="font-size:2.4rem;display:block;margin-bottom:12px;"></i>${msg}</div>`;
    }
    function showErrorState(msg) {
      reportContent.innerHTML = `<div class="empty-state" style="color:#b34a4a;"><i class="fas fa-exclamation-circle" style="font-size:2.4rem;display:block;margin-bottom:12px;"></i>${msg}</div>`;
    }
    function showEmptyReport(msg) {
      reportTitle.innerText = 'Report'; reportSub.innerText = '';
      reportContent.innerHTML = `<div class="empty-state"><i class="fas fa-user-slash" style="font-size:2.2rem;opacity:0.4;display:block;margin-bottom:12px;"></i>${msg}</div>`;
    }

    function getEmployeesForManager(managerId) {
      const mgr = managers.find(m => m.id === managerId);
      if (!mgr) return [];
      if (managerId === 'mgrAll') return allEmployees;
      return allEmployees.filter(p => mgr.sections.includes(p.section));
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================
    function renderManagers() {
      managerListEl.innerHTML = '';
      managers.forEach(mgr => {
        const btn = document.createElement('button');
        btn.className = `manager-btn ${mgr.id === currentManagerId ? 'active' : ''}`;
        btn.innerHTML = `<i class="fas fa-user-tie"></i> ${mgr.label}`;
        btn.dataset.mgr = mgr.id;
        btn.addEventListener('click', () => {
          currentManagerId = mgr.id;
          const filtered = getEmployeesForManager(currentManagerId);
          currentEmployeeIndex = 0;
          renderManagers();
          renderEmployeeList(filtered);
          if (filtered.length > 0) renderReport(filtered[0]);
          else showEmptyReport('No employees under this manager');
        });
        managerListEl.appendChild(btn);
      });
    }

    function renderEmployeeList(employees) {
      employeeItemsEl.innerHTML = '';
      if (!employees || employees.length === 0) {
        employeeItemsEl.innerHTML = '<div style="padding:20px;color:#4e738b;">No team members</div>';
        return;
      }
      employees.forEach((emp, idx) => {
        const btn = document.createElement('button');
        btn.className = `employee-item ${idx === currentEmployeeIndex ? 'active' : ''}`;
        btn.innerHTML = `<i class="fas fa-user"></i> ${emp.name} (${emp.roll})`;
        btn.addEventListener('click', () => {
          currentEmployeeIndex = idx;
          renderEmployeeList(employees);
          renderReport(emp);
        });
        employeeItemsEl.appendChild(btn);
      });
      const active = employeeItemsEl.querySelector('.employee-item.active');
      if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function renderReport(emp) {
      if (!emp) { showEmptyReport('No employee selected'); return; }
      reportTitle.innerText = `${emp.name} · ${emp.roll}`;
      reportSub.innerText = `Section ${emp.section} · ${emp.facultyName || 'Faculty'}`;

      const fmt = (score, grade) => (score || score === 0) ? `${score}-${grade || '—'}` : '—';

      const html = `
        <div class="title-cli">
          <span>Consolidated Leadership Indicators (CLI) Template</span>
          <span class="badge">${emp.section} · ${emp.roll}</span>
        </div>

        <!-- Self-Personality -->
        <div class="section-title">Self-Personality, Self-Efficacy and Locus of Control</div>
        <table>
          <tr><th>O</th><th>C</th><th>E</th><th>A</th><th>S</th></tr>
          <tr><td>${fmt(emp.op, emp.opGrd)}</td><td>${fmt(emp.cst, emp.cstGrd)}</td><td>${fmt(emp.ext, emp.extGrd)}</td><td>${fmt(emp.aown, emp.aownGrd)}</td><td>${fmt(emp.stb, emp.stbGrd)}</td></tr>
          <tr><th colspan="2">SE</th><th colspan="2">LOC</th><th></th></tr>
          <tr><td colspan="2">${fmt(emp.se, emp.seGrd)}</td><td colspan="2">${fmt(emp.loc, emp.locGrd)}</td><td></td></tr>
        </table>
        <div class="note">Note: While writing scores, use actual score followed by grade e.g. 58-R; 69-R/S; 73-S/R etc.</div>
        <table>
          <tr><th>Aware</th><th>Positive</th><th>Control</th></tr>
          <tr><td>${fmt(emp.aown, emp.aownGrd)}</td><td>${fmt(emp.post, emp.postGrd)}</td><td>${fmt(emp.cont, emp.contGrd)}</td></tr>
          <tr><th>Aware Others</th><th>Empathy</th><th>Adapt</th></tr>
          <tr><td>${fmt(emp.aother, emp.aotherGrd)}</td><td>${fmt(emp.empth, emp.empthGrd)}</td><td>${fmt(emp.adpt, emp.adptGrd)}</td></tr>
          <tr><th>Conflict Handling</th><th colspan="2">Overall</th></tr>
          <tr><td>${fmt(emp.conf, emp.confGrd)}</td><td colspan="2">${fmt(emp.eqTot, emp.eqTotGrd)}</td></tr>
        </table>

        <!-- Interpersonal -->
        <div class="section-title">Interpersonal</div>
        <table>
          <tr><th>Exp_Incl</th><th>Want_Incl</th><th>Exp_Cont</th><th>Want_Cont</th><th>Exp_Aff</th><th>Want_Aff</th></tr>
          <tr><td>${fmt(emp.ei, emp.eiGrd)}</td><td>${fmt(emp.wi, emp.wiGrd)}</td><td>${fmt(emp.ec, emp.ecGrd)}</td><td>${fmt(emp.wc, emp.wcGrd)}</td><td>${fmt(emp.ea, emp.eaGrd)}</td><td>${fmt(emp.wa, emp.waGrd)}</td></tr>
          <tr><th>Incl_Tot</th><th>Cont_Tot</th><th></th><th></th><th>Aff_Tot</th><th></th></tr>
          <tr><td>${fmt(emp.incTot, emp.incGrd)}</td><td>${fmt(emp.contTot, emp.contGrd)}</td><td></td><td></td><td>${fmt(emp.affTot, emp.affGrd)}</td><td></td></tr>
          <tr><th>Exp_Tot</th><th>Want_Tot</th><th></th><th></th><th></th><th></th></tr>
          <tr><td>${fmt(emp.expTot, emp.expGrd)}</td><td>${fmt(emp.wantTot, emp.wantGrd)}</td><td></td><td></td><td></td><td></td></tr>
          <tr><th colspan="2">G_Total</th><th colspan="4"></th></tr>
          <tr><td colspan="2">${fmt(emp.firoTot, emp.firoGrd)}</td><td colspan="4"></td></tr>
        </table>

        <!-- Full Range Leadership -->
        <div class="section-title">Full Range Leadership Scores</div>
        <table>
          <tr><th colspan="6">Transformational (TFL)</th><th colspan="3">Transactional (TXL)</th></tr>
          <tr><th>II-A</th><th>II-B</th><th>IM</th><th>IS</th><th>IC</th><th>TOT TFL</th><th>CR</th><th>MBE(A)</th><th>MBE(P)</th></tr>
          <tr><td>${fmt(emp.iia, emp.iiaGrd)}</td><td>${fmt(emp.iib, emp.iibGrd)}</td><td>${fmt(emp.im, emp.imGrd)}</td><td>${fmt(emp.is, emp.isGrd)}</td><td>${fmt(emp.ic, emp.icGrd)}</td><td>${fmt(emp.tflTot, emp.tflGrd)}</td><td>${fmt(emp.crew, emp.crewGrd)}</td><td>${fmt(emp.mba, emp.mbaGrd)}</td><td>${fmt(emp.mbp, emp.mbpGrd)}</td></tr>
          <tr><th>LF</th><th>Effectiveness</th><th>Extra Effort</th><th>Satisfaction</th><th></th><th></th><th></th><th></th><th></th></tr>
          <tr><td>${fmt(emp.lf, emp.lfGrd)}</td><td>${fmt(emp.effect, emp.effectGrd)}</td><td>${fmt(emp.eefrt, emp.eefrtGrd)}</td><td>${fmt(emp.satis, emp.satisGrd)}</td><td></td><td></td><td></td><td></td><td></td></tr>
        </table>

        <!-- PPT -->
        <div class="section-title">SELF - Picture Perception Test or PPT</div>
        <div class="note">(to be used to decide 'guard against' in the deliverables)</div>
        <div class="ppt-block">
          <table>
            <tr><th colspan="3">nPow</th><th colspan="3">nAch</th><th colspan="3">nAff</th></tr>
            <tr><th>Inc</th><th>%</th><th>Interp</th><th>Inc</th><th>%</th><th>Interp</th><th>Inc</th><th>%</th><th>Interp</th></tr>
            <tr><td>${emp.nPowInc || 0}</td><td>${emp.nPowPct || '—'}</td><td>${emp.nPowInterp || '—'}</td><td>${emp.nAchInc || 0}</td><td>${emp.nAchPct || '—'}</td><td>${emp.nAchInterp || '—'}</td><td>${emp.nAffInc || 0}</td><td>${emp.nAffPct || '—'}</td><td>${emp.nAffInterp || '—'}</td></tr>
          </table>
          <div style="margin-top:8px;font-size:0.85rem;">Use: DOM=Dominant; MOD=Moderate; MIN=Minor; INS=Insignificant; ABS=Absent</div>
        </div>

        <div class="footer-note">CLI · data from Google Sheets · ${emp.name} · Faculty: ${emp.facultyName || '—'}</div>
      `;
      reportContent.innerHTML = html;
    }

    // ============================================================
    // RENDER ALL
    // ============================================================
    function renderAll() {
      if (managers.length === 0) return;
      currentManagerId = currentManagerId || managers[0]?.id || 'mgrAll';
      renderManagers();
      const filtered = getEmployeesForManager(currentManagerId);
      if (filtered.length > 0) {
        currentEmployeeIndex = Math.min(currentEmployeeIndex, filtered.length - 1);
        renderEmployeeList(filtered);
        renderReport(filtered[currentEmployeeIndex]);
      } else {
        showEmptyReport('No employees found');
        renderEmployeeList([]);
      }
    }

    // ============================================================
    // PDF DOWNLOAD
    // ============================================================
    async function downloadPDF() {
      const content = document.getElementById('reportContent');
      if (!content || content.innerHTML.includes('empty-state')) {
        alert('Please select an employee first.');
        return;
      }
      try {
        const canvas = await html2canvas(content, {
          scale: 2,
          useCORS: true,
          logging: false,
          backgroundColor: '#ffffff'
        });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        let heightLeft = pdfHeight;
        let position = 0;
        pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
        heightLeft -= pdf.internal.pageSize.getHeight();
        while (heightLeft > 0) {
          position = heightLeft - pdfHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
          heightLeft -= pdf.internal.pageSize.getHeight();
        }
        pdf.save(`CLI_${document.getElementById('reportTitle').innerText.replace(/\s/g,'_')}.pdf`);
      } catch (error) {
        console.error('PDF error:', error);
        alert('Could not generate PDF. Please use Print instead.');
      }
    }

    // ============================================================
    // PRINT
    // ============================================================
    function printReport() { window.print(); }

    // ============================================================
    // REFRESH & INIT
    // ============================================================
    async function refreshData() {
      await fetchDataFromSheets();
    }

    async function init() {
      await fetchDataFromSheets();
      document.getElementById('pdfBtn').addEventListener('click', downloadPDF);
      document.getElementById('printBtn').addEventListener('click', printReport);
      refreshBtn.addEventListener('click', refreshData);
    }

    // If data loads before password, init will be called after unlock.
  })();
</script>
