<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { min-height: 100vh; background: #f4f6fb; color: #1a1a2e; padding: 2rem; }
[hidden] { display: none !important; }

.brand { text-align: center; margin-top: 2rem; }
.brand .logo { width: 90px; height: 90px; object-fit: contain; margin-bottom: 1rem; }
.brand h1 { font-size: 2rem; letter-spacing: .5px; }
.brand .institute { font-size: .9rem; color: #666; margin-top: .25rem; }

.roles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 2rem; max-width: 900px;
  margin: 4rem auto 0; padding: 0 1rem;
}
.role-card {
  background: linear-gradient(145deg, #ffffff, #e6ecff);
  border-radius: 24px; padding: 3rem 1.5rem;
  text-align: center; text-decoration: none; color: inherit;
  box-shadow: 0 10px 25px rgba(50,80,180,.15);
  border: 1px solid #dbe4ff;
  transition: transform .2s, box-shadow .2s;
}
.role-card:hover { transform: translateY(-6px); box-shadow: 0 18px 35px rgba(50,80,180,.25); }
.role-card h2 { font-size: 1.6rem; margin-bottom: .5rem; }
.role-card p  { color: #556; font-size: .9rem; }

.login-box {
  max-width: 420px; margin: 6rem auto; background: #fff;
  padding: 2.5rem; border-radius: 20px;
  box-shadow: 0 15px 40px rgba(50,80,180,.12);
}
.login-box h2 { text-align: center; margin-bottom: 1.5rem; }
.login-box label { display: block; font-size: .85rem; color: #556; margin-bottom: .35rem; }
.login-box input {
  width: 100%; padding: .8rem 1rem; margin-bottom: 1.2rem;
  border-radius: 10px; border: 1px solid #ccd; font-size: 1rem;
}
.login-box input:focus { outline: 2px solid #3b5bdb; outline-offset: 1px; }
.login-box button {
  width: 100%; padding: .9rem; border: none; border-radius: 10px;
  background: #3b5bdb; color: #fff; font-size: 1rem; cursor: pointer;
}
.login-box button:hover:not(:disabled) { background: #2c46b0; }
.login-box button:disabled { opacity: .6; cursor: wait; }
.err { color: #d23; text-align: center; margin-top: 1rem; font-size: .9rem; line-height: 1.4; }
.err small { display: block; margin-top: .35rem; color: #888; font-size: .72rem; word-break: break-all; text-align: left; }
.back { text-align: center; margin-top: 1.5rem; font-size: .85rem; }
.back a { color: #556; text-decoration: none; }
.back a:hover { color: #3b5bdb; }

.dash { max-width: 780px; margin: 3rem auto; }
.dash h1 { text-align: center; margin-bottom: 2rem; }
.assessment-row {
  background: #fff; border-radius: 16px; padding: 1.2rem 1.5rem;
  margin-bottom: 1rem; display: flex; justify-content: space-between;
  align-items: center; box-shadow: 0 6px 18px rgba(50,80,180,.08);
  text-decoration: none; color: inherit;
  transition: transform .15s, box-shadow .15s;
}
.assessment-row:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(50,80,180,.14); }
.assessment-row.done { background: #e7f8ec; cursor: default; }
.assessment-row.done:hover { transform: none; }
.assessment-row .status { color: #3b5bdb; font-weight: 600; font-size: .9rem; }
.assessment-row.done .status { color: #2a9d54; }
</style>
</head>
<body>

<section id="view-home" class="view">
  <header class="brand">
    <img src="assets/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h1>Leadership Assessment & Development Center (LADC)</h1>
    <p class="institute">TAPMI BLR</p>
  </header>
  <section class="roles">
    <a href="#login?role=Taker"   class="role-card"><h2>Taker</h2><p>Enrollment-based access</p></a>
    <a href="#login?role=Advisor" class="role-card"><h2>Advisor</h2><p>Advisor portal</p></a>
    <a href="#login?role=Admin"   class="role-card"><h2>Admin</h2><p>Administrator access</p></a>
  </section>
</section>

<section id="view-login" class="view" hidden>
  <div class="login-box">
    <h2 id="roleTitle">Login</h2>
    <form id="loginForm" autocomplete="off">
      <label for="enroll">Enrollment Number</label>
      <input id="enroll" required autocapitalize="characters">
      <label for="code">Passcode</label>
      <input id="code" type="password" required>
      <button type="submit" id="submitBtn">Login</button>
    </form>
    <p class="err" id="errMsg" hidden></p>
    <p class="back"><a href="#home">← Back to home</a></p>
  </div>
</section>

<section id="view-dashboard" class="view" hidden>
  <div class="dash">
    <h1 id="welcome">Assessments</h1>
    <div id="list"></div>
    <p class="back"><a href="#logout">Log out</a></p>
  </div>
</section>

<script>
/* ================================================================
   CONFIG
   ================================================================ */
// Remove SHEET_ID, PUBLISHED_TOKEN, and all candidateUrls
async function loadCSV() {
  const res = await fetch("https://broken-term-9f64.kmarlapudi.workers.dev/?sheet=Master%20Student%20Data");
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.text();
}

/* ================================================================
   Candidate URLs
   ================================================================ */
function candidateUrls() {
  const urls = [];
  urls.push(`https://docs.google.com/spreadsheets/d/e/${PUBLISHED_TOKEN}/pub?output=csv`);
  for (const name of SHEET_NAMES) {
    const enc = encodeURIComponent(name);
    urls.push(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${enc}`);
  }
  for (const name of SHEET_NAMES) {
    const enc = encodeURIComponent(name);
    urls.push(`https://docs.google.com/spreadsheets/d/e/${PUBLISHED_TOKEN}/pub?output=csv&sheet=${enc}`);
  }
  const withProxies = [];
  urls.forEach(u => withProxies.push({ label: "direct", url: u }));
  urls.forEach(u => withProxies.push({ label: "proxy",  url: PROXY + encodeURIComponent(u) }));
  return withProxies;
}

/* ================================================================
   CSV parsing
   ================================================================ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* ================================================================
   Multi-source fetch
   ================================================================ */
async function loadCSV() {
  const attempts = candidateUrls();
  const errors = [];
  for (let i = 0; i < attempts.length; i++) {
    const a = attempts[i];
    try {
      const res = await fetch(a.url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (!text.includes(",") || text.length < 10) throw new Error("Non-CSV response");
      return text;
    } catch (e) {
      errors.push(`#${i + 1} ${a.label}: ${e.message || e}`);
    }
  }
  throw new Error("All sources failed:\n" + errors.join("\n"));
}

/* ================================================================
   Helpers
   ================================================================ */
const $ = (s) => document.querySelector(s);
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.hidden = true);
  document.getElementById(id).hidden = false;
  window.scrollTo(0, 0);
}
function setError(msg, detail) {
  const err = $("#errMsg");
  err.innerHTML = "";
  err.appendChild(document.createTextNode(msg));
  if (detail) {
    const d = document.createElement("small");
    d.textContent = detail;
    err.appendChild(d);
  }
  err.hidden = false;
}
function clearError() { $("#errMsg").hidden = true; }

/* ================================================================
   Session
   ================================================================ */
function session() {
  return {
    role:   sessionStorage.getItem("role"),
    enroll: sessionStorage.getItem("enroll"),
    name:   sessionStorage.getItem("name")
  };
}

/* ================================================================
   Login
   ================================================================ */
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#submitBtn");
  clearError();
  btn.disabled = true;
  btn.textContent = "Checking…";

  const role   = new URLSearchParams(location.hash.split("?")[1] || "").get("role") || "Taker";
  const enroll = $("#enroll").value.trim();
  const code   = $("#code").value.trim();

  let rows;
  try {
    const csv = await loadCSV();
    rows = parseCSV(csv);
  } catch (err) {
    console.error(err);
    setError("Could not load the spreadsheet. Check your internet and try again.", err.message);
    btn.disabled = false; btn.textContent = "Login";
    return;
  }

  const data = rows.slice(SKIP_ROWS);

  const match = data.find(r =>
    (r[COL_ENROLLMENT] || "").trim() === enroll &&
    (r[COL_PASSCODE]   || "").trim() === code
  );

  if (!match) {
    setError("Please check your enrollment ID and password and try again. Else contact the LADC team.");
    btn.disabled = false; btn.textContent = "Login";
    return;
  }

  const displayName = (match[COL_NAME] || "").trim() || enroll;

  sessionStorage.setItem("role",   role);
  sessionStorage.setItem("enroll", enroll);
  sessionStorage.setItem("name",   displayName);

  if (role === "Taker") {
    renderDashboard();
    location.hash = "#dashboard";
  } else {
    alert(role + " dashboard coming soon.");
    location.hash = "#home";
  }
});

/* ================================================================
   Dashboard
   ================================================================ */
function renderDashboard() {
  const { enroll, role, name } = session();
  if (!enroll || role !== "Taker") { location.hash = "#login?role=Taker"; return; }

  $("#welcome").textContent = `Welcome, ${name || enroll}`;
  const list = $("#list");
  list.innerHTML = "";

  const progress = JSON.parse(localStorage.getItem(`progress_${enroll}`) || "[]");
  for (let i = 1; i <= ASSESSMENT_COUNT; i++) {
    const id = "A" + i;
    const done = progress.includes(id);
    const row = document.createElement("a");
    row.className = "assessment-row" + (done ? " done" : "");
    row.href = "javascript:void(0)";
    row.innerHTML = `<span>Assessment ${i}</span>
                     <span class="status">${done ? "Completed ✓" : "Pending"}</span>`;
    list.appendChild(row);
  }
  show("view-dashboard");
}

/* ================================================================
   Router
   ================================================================ */
function route() {
  const hash = location.hash || "#home";
  const view = hash.split("?")[0];
  const role = new URLSearchParams(hash.split("?")[1] || "").get("role");

  if (view === "#login") {
    $("#roleTitle").textContent = (role || "Taker") + " Login";
    clearError();
    $("#submitBtn").disabled = false;
    $("#submitBtn").textContent = "Login";
    $("#loginForm").reset();
    show("view-login");
  } else if (view === "#dashboard") {
    renderDashboard();
  } else if (view === "#logout") {
    sessionStorage.clear();
    location.hash = "#home";
  } else {
    show("view-home");
  }
}
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
</script>
</body>
</html>
