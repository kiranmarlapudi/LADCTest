<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Conclave 2026</title>
    <style>
        /* CSS Reset and Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* 1. Background Setup (Image + #FEB6AB blend + 60% dark overlay) */
        .app-container {
            min-height: 100vh;
            background-color: #FEB6AB; 
            background-image: url('https://raw.githubusercontent.com/kiranmarlapudi/LADCTest/main/HRCBG.png');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply; /* Blends the pink color into the image */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Dark overlay to ensure text readability */
        .app-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* 60% dark opacity */
            z-index: 1;
            pointer-events: none;
        }

        /* 2. Header Logos */
        .header-banner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 0 0;
            position: relative;
            z-index: 2;
            gap: 10px;
        }
        
        /* Small Logo (TAPMI) - Enlarged to 2x as requested */
        .header-top-logo {
            width: 300px; /* Adjusted to 2x proportional size */
            height: auto;
            object-fit: contain;
        }

        /* Large Main Banner (HRFSH) - Kept at 1x standard size */
        .header-main-banner {
            width: 70%;
            max-width: 900px;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 3. Navigation Styling (Always Visible at Bottom) */
        .bottom-nav {
            margin-top: auto;
            padding: 20px 0 30px 0;
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .bottom-nav a {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 0 12px;
            transition: color 0.3s;
        }
        .bottom-nav a:hover {
            color: #FFD700; /* Yellow on hover */
        }
        .bottom-nav .separator {
            color: #666;
        }

        /* 4. Page Content */
        .page-content {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* 5. Homepage Specific Styling (Fixed Duplicate text & Yellow color) */
        #home-page {
            display: flex;
        }
        
        #home-page .main-title {
            font-size: 5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            /* YELLOW COLOR applied here as requested */
            background: linear-gradient(to right, #fceabb, #f8b500); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 3px;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        #home-page .round-title {
            font-size: 3.5rem;
            margin: 0;
            color: #c4b5fd; /* Lighter purple for contrast */
            font-weight: 600;
        }

        #home-page .sub-title {
            font-size: 2rem;
            margin: 15px 0 0 0;
            font-weight: 400;
            color: #FFD700; /* Yellow subtitle */
        }

        /* Hidden Pages Styling */
        .other-page {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .other-page h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #FEB47B, #FF7E5F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .other-page p {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #fff;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 768px) {
            #home-page .main-title { font-size: 2.8rem; }
            #home-page .round-title { font-size: 2.2rem; }
            #home-page .sub-title { font-size: 1.5rem; }
            .bottom-nav a { display: inline-block; margin: 5px 8px; font-size: 1rem; }
            .header-top-logo { width: 150px; }
            .header-main-banner { width: 95%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER AREA -->
        <header class="header-banner">
            <!-- TAPMI Logo (2x Size) -->
            <img src="https://raw.githubusercontent.com/kiranmarlapudi/LADCTest/main/tapmi-bengaluru-2024-logo.png" 
                 alt="TAPMI Logo" 
                 class="header-top-logo">
            
            <!-- HRFSH Banner (Normal 1x Size) -->
            <img src="https://raw.githubusercontent.com/kiranmarlapudi/LADCTest/main/HRFSH.png" 
                 alt="HR Conclave Banner" 
                 class="header-main-banner">
        </header>

        <!-- MAIN PAGES -->
        
        <!-- HOME PAGE -->
        <div id="home-page" class="page-content">
            <!-- CASE PRESENTATION in Yellow/Gold -->
            <div class="main-title">CASE<br>PRESENTATION</div>
            <!-- Round 3 in Purple -->
            <div class="round-title">Round 3</div>
            <!-- Subtitle in Yellow -->
            <div class="sub-title">Case Presentation</div>
        </div>

        <!-- TEAM 1 PAGE -->
        <div id="team1" class="page-content other-page">
            <h1>Team 1</h1>
            <p>Presentation details go here...</p>
        </div>

        <!-- TEAM 2 PAGE -->
        <div id="team2" class="page-content other-page">
            <h1>Team 2</h1>
            <p>Presentation details go here...</p>
        </div>

        <!-- TEAM 3 PAGE -->
        <div id="team3" class="page-content other-page">
            <h1>Team 3</h1>
            <p>Presentation details go here...</p>
        </div>

        <!-- FINAL SCORES PAGE -->
        <div id="final-scores" class="page-content other-page">
            <h1>Final Scores</h1>
            <p>Leaderboard details go here...</p>
        </div>


        <!-- BOTTOM NAVIGATION (ALWAYS VISIBLE) -->
        <nav class="bottom-nav">
            <!-- No icons present. All links visible on every page. -->
            <a href="#" onclick="showPage('home')">Home</a>
            <span class="separator">|</span>
            <a href="#" onclick="showPage('team1')">Team 1</a>
            <span class="separator">|</span>
            <a href="#" onclick="showPage('team2')">Team 2</a>
            <span class="separator">|</span>
            <a href="#" onclick="showPage('team3')">Team 3</a>
            <span class="separator">|</span>
            <a href="#" onclick="showPage('final-scores')">Final Scores</a>
        </nav>

    </div>

    <!-- JAVASCRIPT TO SWITCH PAGES (Nav stays visible) -->
    <script>
        function showPage(pageId) {
            // Hide all content pages
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('team1').style.display = 'none';
            document.getElementById('team2').style.display = 'none';
            document.getElementById('team3').style.display = 'none';
            document.getElementById('final-scores').style.display = 'none';

            // Show the selected page
            if(pageId === 'home') {
                document.getElementById('home-page').style.display = 'flex';
            } else {
                document.getElementById(pageId).style.display = 'flex';
            }
        }

        // Initialize to Home on load
        showPage('home');
    </script>
</body>
</html>
