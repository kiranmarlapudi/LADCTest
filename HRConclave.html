<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Conclave 2026</title>
    <style>
        /* CSS Reset and Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* 1. Background Setup (Image + #FEB6AB overlay) */
        .app-container {
            min-height: 100vh;
            /* The background color #FEB6AB is blended with the image */
            background-color: #FEB6AB; 
            background-image: url('https://raw.githubusercontent.com/kiranmarlapudi/LADCTest/main/HRCBG.png');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply; /* Blends the pink color with the image */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Dark overlay to achieve 50-70% opacity for text readability */
        .app-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* 60% dark overlay */
            z-index: 1;
            pointer-events: none;
        }

        /* 2. Banner Logo (Enlarged to 2x) */
        .header-banner {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            position: relative;
            z-index: 2;
        }
        .header-banner img {
            /* Enlarged to 2x proportion */
            width: 80%; 
            max-width: 1200px; 
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* Navigation Styling (Bottom Links) */
        .bottom-nav {
            margin-top: auto; /* Pushes nav to bottom */
            padding: 20px 0;
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        .bottom-nav a {
            color: #FFD700; /* Gold color to match aesthetic */
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 0 15px;
            transition: color 0.3s;
        }
        .bottom-nav a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .bottom-nav .separator {
            color: #888;
        }

        /* Page Content Handling */
        .page-content {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        /* Homepage Specific Styling */
        #home-page {
            display: flex; /* Show by default */
        }
        
        #home-page h1 {
            font-size: 5rem; /* Extra large for "CASE PRESENTATION" */
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to right, #FEB47B, #FF7E5F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        #home-page h2 {
            font-size: 3rem;
            margin: 10px 0 0 0;
            color: #cbcbf5;
        }

        #home-page h3 {
            font-size: 2rem;
            margin: 20px 0 0 0;
            color: #FFD700;
        }

        /* Team Pages Styling (Hidden on Home) */
        .team-page {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
        }
        
        .team-page h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #FEB47B, #FF7E5F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .team-page p {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #fff;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #home-page h1 { font-size: 3rem; }
            #home-page h2 { font-size: 2rem; }
            #home-page h3 { font-size: 1.5rem; }
            .bottom-nav a { display: inline-block; margin: 5px 8px; font-size: 1rem; }
            .header-banner img { width: 95%; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Replaced HR CONCLAVE 2026 Text with HRFSH.png (Enlarged 2x via CSS) -->
        <header class="header-banner">
            <img src="https://raw.githubusercontent.com/kiranmarlapudi/LADCTest/main/HRFSH.png" alt="HR Conclave 2026 Logo">
        </header>

        <!-- MAIN CONTENT -->
        
        <!-- HOME PAGE (Phase 3 Case Presentation) -->
        <div id="home-page" class="page-content">
            <!-- Removed 🏠 icon. Expanded CASE PRESENTATION text -->
            <h1>CASE<br>PRESENTATION</h1>
            
            <!-- Changed Phase 3 to Round 3 -->
            <h2>Round 3</h2>
            <h3>Case Presentation</h3>
        </div>

        <!-- TEAM PAGES (Hidden on Home) -->
        <div id="team1" class="page-content team-page">
            <h1>Team 1</h1>
            <p>Presentation details go here...</p>
        </div>

        <div id="team2" class="page-content team-page">
            <h1>Team 2</h1>
            <p>Presentation details go here...</p>
        </div>

        <div id="team3" class="page-content team-page">
            <h1>Team 3</h1>
            <p>Presentation details go here...</p>
        </div>

        <div id="final-scores" class="page-content team-page">
            <h1>Final Scores</h1>
            <p>Leaderboard details go here...</p>
        </div>


        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <!-- Removed 🏠 icon from Home link -->
            <a href="#" onclick="showPage('home')">Home</a>
            
            <!-- These links are only hidden on the homepage via JS -->
            <span class="separator" id="sep1">|</span>
            <a href="#" onclick="showPage('team1')" id="link-team1">Team 1</a>
            
            <span class="separator" id="sep2">|</span>
            <a href="#" onclick="showPage('team2')" id="link-team2">Team 2</a>
            
            <span class="separator" id="sep3">|</span>
            <a href="#" onclick="showPage('team3')" id="link-team3">Team 3</a>
            
            <span class="separator" id="sep4">|</span>
            <!-- Removed 🏆 icon from Final Scores link -->
            <a href="#" onclick="showPage('final-scores')" id="link-scores">Final Scores</a>
        </nav>

    </div>

    <!-- JAVASCRIPT TO CONTROL PAGE SWITCHING -->
    <script>
        function showPage(pageId) {
            // Hide all pages
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('team1').style.display = 'none';
            document.getElementById('team2').style.display = 'none';
            document.getElementById('team3').style.display = 'none';
            document.getElementById('final-scores').style.display = 'none';

            // Show the selected page
            if(pageId === 'home') {
                document.getElementById('home-page').style.display = 'flex';
            } else {
                document.getElementById(pageId).style.display = 'flex';
            }

            // Handle Visibility of Navigation Tabs
            const navLinks = ['link-team1', 'link-team2', 'link-team3', 'link-scores'];
            const separators = ['sep1', 'sep2', 'sep3', 'sep4'];

            if (pageId === 'home') {
                // HIDE team links on the homepage
                navLinks.forEach(id => document.getElementById(id).style.display = 'none');
                separators.forEach(id => document.getElementById(id).style.display = 'none');
            } else {
                // SHOW team links on other pages
                navLinks.forEach(id => document.getElementById(id).style.display = 'inline');
                separators.forEach(id => document.getElementById(id).style.display = 'inline');
            }
        }

        // Initialize the page to Home on load
        showPage('home');
    </script>
</body>
</html>
